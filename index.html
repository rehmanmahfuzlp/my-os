<script>

const mn=t=>{const[h,m]=t.split(':');return +h*60+ +m};

['wd','23:00','00:30','Wind Down ও স্লিপ প্রিপারেশন','Personal','স্ক্রিন বন্ধ করে প্রস্তুতি নিন'],

wi:['GTA 6 Wiki Website','#059669','নিম্ন','দীর্ঘমেয়াদি; প্রতিদিন ডেভেলপ করতে হবে না',['ওয়েবসাইট স্ট্রাকচার','ক্যারেক্টার','মিশন','ম্যাপ','গাইড','সার্চ ফাংশন','SEO কনটেন্ট স্ট্র্যাটেজি','অ্যাড মনিটাইজেশন','অ্যাফিলিয়েট সুযোগ']]};

const stat=k=>{const it=items(k),d=dv(k).t,dn=it.filter(i=>d[i.id]=='d').length,sk=it.filter(i=>d[i.id]=='s').length;return{dn,sk,tot:it.length,p:Math.round(dn/Math.max(1,it.length-sk)*100)}};

tg(id){const d=dw(cur);d.t[id]=d.t[id]=='d'?'':'d';save();render()},
sk(id){const d=dw(cur);d.t[id]=d.t[id]=='s'?'':'s';save();render()},
ex(id){open=open==id?'':id;render()},
ed(id,f,v){const d=dw(cur),x=d.x.find(y=>y.id==id);if(x)x[f]=v;else{const r=R.find(y=>y[0]==id);if(f=='n')d.nm[id]=v;else{const t=d.tm[id]||[r[1],r[2]];t[f=='s'?0:1]=v;d.tm[id]=t}}save();render()},
ad(){const n=$('cn').value.trim(),s=$('cs').value,e=$('ce').value;if(!n||!s||!e){msg='নাম ও সময় দিন';return render()}dw(cur).x.push({id:'c'+Date.now(),s,e,n,c:$('cc').value,ds:'কাস্টম টাস্ক'});save();render()},
del(id){const d=dw(cur);d.x=d.x.filter(x=>x.id!=id);delete d.t[id];open='';save();render()},
rs(){if(!rc){rc=1;return render()}dw(cur).t={};rc=0;save();render()},
c(p,n){sv(p,Math.max(0,gv(dv(cur),p)+n));save();render()},
st(f,v){S.set[f]=Math.max(0,+v||0);save();render()},
al(){const n=$('ln').value.trim();if(!n){msg='লিডের নাম দিন';return render()}S.leads.unshift({id:'l'+Date.now(),n,ct:$('lc').value,sv:$('lsv').value,pr:$('lpr').value,st:0,nx:$('lnx').value,nt:$('lnt').value,lc:''});save();render()},
ls(id,v){const l=S.leads.find(x=>x.id==id);l.st=+v;if(v>=2)l.lc=td();save();render()},
dl(id){S.leads=S.leads.filter(x=>x.id!=id);save();render()},
pj(k){pj=pj==k?'':k;render()},
pt(k,i){S.proj[k][i].d=S.proj[k][i].d?0:1;save();render()},
pr(k,i){S.proj[k].splice(i,1);save();render()},
pa(k){const v=$('pi'+k).value.trim();if(v){S.proj[k].push({t:v,d:0});save();render()}},
mr(x){S.mr[x]=!S.mr[x];save();render()},
dk(){const d=document.documentElement.dataset.theme=='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);S.dark=!d;save();render()},
ex2(){$('jx').value=JSON.stringify(S,null,1);$('jx').select()},
im(){try{const o=JSON.parse($('jx').value);if(!o||typeof o.days!='object'||!o.set||typeof o.set.price!='number'||!Array.isArray(o.leads)||!o.proj||typeof o.proj!='object')throw 0;S=Object.assign(mk(),o);Object.keys(PM).forEach(k=>{if(!Array.isArray(S.proj[k]))S.proj[k]=seed(k)});save();msg='ইমপোর্ট সফল';render()}catch(e){msg='ইমপোর্ট ব্যর্থ — সঠিক এক্সপোর্ট করা JSON দিন';render()}},
cp(id){const e=$(id);e.select();try{navigator.clipboard.writeText(e.value)}catch(x){document.execCommand&&document.execCommand('copy')}}};
const TB=[['home','🏠','হোম'],['rt','🗓️','Routine'],['bz','💼','Business'],['pj','🚀','Projects'],['ln','📚','Learning'],['mo','☰','আরও']];
function render(){document.documentElement.dataset.theme=S.dark===true?'dark':'light';
$('m').innerHTML=(msg?`<div class="c pop">${msg}</div>`:'')+V[tab]();msg='';if(tab!='rt')rc=0;
$('nv').innerHTML=TB.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="A.go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
render();
setInterval(()=>{const a=document.activeElement;if(!a||a.tagName=='BODY')render()},60000);
</script></body></html>
